name: Commit generated results

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Artifact containing the generated out directory
        required: true
        type: string
      update_latest:
        description: Replace out/output.md from the artifact
        required: true
        type: boolean
      source:
        description: Human-readable generation source
        required: true
        type: string

permissions:
  contents: write

jobs:
  commit-results:
    concurrency:
      group: auto-update-results
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout auto_update branch
        run: |
          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/auto_update; then
            git checkout -b auto_update origin/auto_update
          else
            git checkout -b auto_update origin/main
          fi

      - name: Download results
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: .results

      - name: Apply results
        env:
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          test -d .results/md
          test -d .results/json
          mkdir -p out
          if [ "$UPDATE_LATEST" != "true" ]; then
            rm -f .results/output.md
          fi
          cp -a .results/. out/
          rm -rf .results

      - name: Merge main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit
          git add -f out/

      - name: Commit and push results
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi
          git commit -m "[skip ci] Update arXiv results from ${SOURCE}"
          git push origin HEAD:auto_update
