name: Publish Github Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "Run daily arxiv", "Run past arxiv day" ]
    types: [completed]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout `auto_update` branch
        uses: actions/checkout@v7
        with:
          ref: auto_update

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build static archive
        run: python scripts/build_site.py --source out/json --output dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
